url: https://cttir.github.io/sandtablR/

template:
  bootstrap: 5
  bslib:
    primary: "#5E2C8E"

development:
  mode: auto

navbar:
  bg: dark

reference:
- title: Data model
  desc: >
    A casualty is a patient card; an ordered set of them is a cohort; a cohort
    plus board capacities is a scenario. Validation is vectorised over the
    cohort, so a bad import names every offending row and column at once.
  contents:
  - sdt_patient_card
  - validate_patient_card
  - format.patient_card
  - sdt_cohort
  - validate_cohort
  - sdt_as_patient_cards
  - sdt_scenario
  - as_tibble.scenario
  - autoplot.scenario
  - sdt_vocabularies

- title: Reference distributions
  desc: >
    The published marginals the package calibrates against, kept apart from
    sandtablR's own modelling choices so a calibration test cannot quietly
    check the model against its own assumptions.
  contents:
  - sdt_reference
  - sdt_reference_scenario
  - sdt_reference_horizon

- title: Synthetic data
  desc: >
    Generate a cohort from marginals, or synthesise a releasable replica of a
    real one.
  contents:
  - sdt_synthetic_cohort
  - sdt_synthesise
  - sdt_synthesis_utility
  - sdt_add_decisions

- title: Simulation
  desc: >
    A discrete-event model of the board. The event log it records, not the
    summary, is what everything downstream is built on.
  contents:
  - sdt_simulate
  - summary.game_run

- title: Decision paths
  desc: >
    Casualty pathways as state sequences: their shape, their groupings, and
    how repeatably the same casualty is handled.
  contents:
  - sdt_decision_paths
  - sdt_decision_consistency
  - sdt_seqdef
  - sdt_seq_cluster

- title: Machine learning
  desc: >
    One interface over interpretable and black-box engines, scored on the same
    held-out split.
  contents:
  - sdt_fit
  - sdt_workflowset
  - sdt_engines
  - sdt_metric_set
  - sdt_metrics
  - sdt_predictions
  - predict.sdt_model
  - sdt_consistency_score

- title: Explainability
  contents:
  - sdt_explain
  - sdt_importance
  - sdt_profile
  - sdt_shap

- title: Visualisation
  contents:
  - sdt_plot_triage_mix
  - sdt_plot_utilisation
  - sdt_plot_flow
  - sdt_plot_end_state
  - sdt_plot_sequences
  - sdt_roc

- title: The workbench
  contents:
  - sdt_run_app
  - sdt_app
  - sdt_app_ui
  - sdt_app_server

articles:
- title: Articles
  navbar: ~
  contents:
  - sandtablR
  - model-bench
